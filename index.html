
<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>DI Atspindys</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #f3f3f3;
      --muted: #777;
      --accent: #b8c9ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      position: relative;
      min-height: 100svh;
      padding: 42px 54px;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 13px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #777;
      transition: background .3s, box-shadow .3s;
    }

    body.active .dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
    }

    .clock {
      font-size: clamp(64px, 11vw, 132px);
      line-height: 1;
      font-weight: 300;
      letter-spacing: -.075em;
      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-top: 18px;
      color: #999;
      font-size: 14px;
      letter-spacing: .04em;
      text-transform: capitalize;
    }

    .greeting {
      margin-top: 54px;
      font-size: clamp(20px, 2.3vw, 27px);
      font-weight: 400;
      letter-spacing: -.025em;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .conversation {
      display: none;
      width: min(100%, 760px);
      align-items: center;
      flex-direction: column;
    }

    body.active .idle { display: none; }
    body.active .conversation { display: flex; }

    .orb {
      position: relative;
      width: min(64vw, 440px);
      height: min(35vh, 220px);
      min-height: 130px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .orb::before, .orb::after {
      content: "";
      position: absolute;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      filter: blur(35px);
      opacity: 0;
      background: #819cff;
      transition: opacity .5s;
      z-index: -1;
    }

    body.active .orb::before { opacity: .15; }
    body.speaking .orb::after {
      opacity: .18;
      transform: translateX(45px);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .state {
      margin-top: 6px;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: .01em;
    }

    .transcript {
      min-height: 24px;
      max-width: 600px;
      margin-top: 14px;
      color: #999;
      font-size: 14px;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 26px;
    }

    button {
      font: inherit;
      cursor: pointer;
      color: var(--fg);
    }

    .mic {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 1px solid #444;
      border-radius: 50%;
      background: #171717;
      transition: transform .2s, background .2s, border-color .2s;
    }

    .mic:hover {
      transform: scale(1.06);
      background: #242424;
      border-color: #888;
    }

    .mic:active { transform: scale(.96); }

    .mic svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .end {
      border: 0;
      background: transparent;
      color: #888;
      font-size: 12px;
      padding: 12px;
    }

    .end:hover { color: white; }

    footer {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
    }

    .weather { text-align: right; }

    @media (max-width: 600px) {
      .screen { padding: 25px 22px; }
      .brand { font-size: 10px; }
      .clock { font-size: 19vw; }
      .greeting { margin-top: 38px; }
      .orb { width: 90vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="brand">DI <span style="color:#999">ATSPINDYS</span></div>
      <div class="connection">
        <span class="dot"></span>
        <span id="connection">PARENGTAS</span>
      </div>
    </header>

    <main>
      <section class="idle">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date">Įkeliama...</div>
        <div class="greeting" id="greeting">Labas.</div>
        <div class="hint">Sakyk „Labas, Atspindy“ arba paspausk mikrofoną</div>
      </section>

      <section class="conversation" aria-live="polite">
        <div class="orb">
          <canvas id="wave"></canvas>
        </div>
        <div class="state" id="state">Klausausi...</div>
        <div class="transcript" id="transcript"></div>
        <div class="controls">
          <button class="mic" id="mic" aria-label="Aktyvuoti mikrofoną"
                  title="Kalbėti su Atspindžiu">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="12" rx="3"/>
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"/>
            </svg>
          </button>
          <button class="end" id="close">Baigti pokalbį</button>
        </div>
      </section>
    </main>

    <footer>
      <span>ASMENINIS AI ASISTENTAS</span>
      <span class="weather">ORAI · BUS PRIJUNGTI</span>
    </footer>
  </div>

  <script>
const $ = id => document.getElementById(id);
const clock = $('clock');
const date = $('date');
const greeting = $('greeting');
const state = $('state');
const transcript = $('transcript');
const connection = $('connection');
const canvas = $('wave');
const ctx = canvas.getContext('2d');

let active = false;
let recording = false;
let processing = false;
let audioContext = null;
let analyser = null;
let micAnalyser = null;
let stream = null;
let animationFrame = 0;
let recorder = null;
let recordedChunks = [];
let playbackElement = null;
let playbackSource = null;
let playbackAnalyser = null;

function updateClock() {
  const now = new Date();
  clock.textContent = new Intl.DateTimeFormat('lt-LT', {
    hour: '2-digit', minute: '2-digit', hour12: false
  }).format(now);

  date.textContent = new Intl.DateTimeFormat('lt-LT', {
    weekday: 'long', year: 'numeric',
    month: 'long', day: 'numeric'
  }).format(now);

  const hour = now.getHours();
  greeting.textContent =
    hour < 5 ? 'Labos nakties.' :
    hour < 12 ? 'Labas rytas.' :
    hour < 18 ? 'Laba diena.' : 'Labas vakaras.';
}

updateClock();
setInterval(updateClock, 1000);

function setState(value) {
  state.textContent = value;
}

async function startAudio() {
  if (stream && audioContext) {
    await audioContext.resume();
    return;
  }

  stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  });

  audioContext = new (window.AudioContext ||
    window.webkitAudioContext)();

  await audioContext.resume();

  micAnalyser = audioContext.createAnalyser();
  micAnalyser.fftSize = 512;
  micAnalyser.smoothingTimeConstant = 0.78;

  audioContext.createMediaStreamSource(stream).connect(micAnalyser);
  analyser = micAnalyser;

  resizeCanvas();
  drawWave();
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resizeCanvas);

function drawWave() {
  cancelAnimationFrame(animationFrame);

  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (!w || !h) return;

  let phase = 0;

  function frame() {
    animationFrame = requestAnimationFrame(frame);
    ctx.clearRect(0, 0, w, h);
    phase += 0.025;

    const currentAnalyser = analyser;
    let bins = null;

    if (currentAnalyser) {
      bins = new Uint8Array(currentAnalyser.frequencyBinCount);
      currentAnalyser.getByteFrequencyData(bins);
    }

    const energy = bins
      ? bins.reduce((sum, value) => sum + value, 0) /
        bins.length / 110
      : 0.04;

    const amplitude = 5 + Math.min(energy, 1) * 46;
    const lines = 7;

    for (let layer = 0; layer < lines; layer++) {
      ctx.beginPath();

      for (let x = 0; x <= w; x += 2) {
        const t = x / w;
        const envelope = Math.pow(Math.sin(Math.PI * t), 0.8);
        const frequency = 1.7 + layer * 0.11;
        const audio = bins
          ? bins[Math.min(
              bins.length - 1,
              Math.floor(t * bins.length)
            )] / 255 * 0.7
          : 0;

        const wave =
          Math.sin(t * Math.PI * frequency * 2 + phase +
            layer * 0.24) *
          amplitude * (0.2 + audio) * envelope;

        const ripple =
          Math.sin(t * 18 - phase * 1.5 + layer) *
          amplitude * 0.13 * envelope;

        const y = h / 2 + wave + ripple;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle =
        `rgba(190, 205, 255, ${0.12 + layer / lines * 0.48})`;
      ctx.lineWidth = layer === lines - 1 ? 1.8 : 1;
      ctx.stroke();
    }
  }

  frame();
}

async function beginRecording() {
  if (active || processing) return;

  active = true;
  document.body.classList.add('active');
  connection.textContent = 'AKTYVUS';
  transcript.textContent = '';

  try {
    await startAudio();

    if (!window.MediaRecorder) {
      throw new Error('Ši naršyklė nepalaiko garso įrašymo.');
    }

    const mimeType = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4'
    ].find(type => MediaRecorder.isTypeSupported(type));

    recorder = mimeType
      ? new MediaRecorder(stream, { mimeType })
      : new MediaRecorder(stream);

    recordedChunks = [];

    recorder.ondataavailable = event => {
      if (event.data.size > 0) recordedChunks.push(event.data);
    };

    recorder.onerror = event => {
      console.error('Recording error:', event.error);
      setState('Įrašymo klaida');
    };

    recorder.onstop = () => {
      recording = false;
      $('mic').disabled = true;
      processRecording().finally(() => {
        $('mic').disabled = false;
      });
    };

    recorder.start(250);
    recording = true;
    setState('Klausausi... paspausk mikrofoną, kai baigsi');
  } catch (error) {
    console.error('Could not start recording:', error);
    setState('Mikrofonas nepasiekiamas');
    transcript.textContent = error.message ||
      'Patikrink mikrofono leidimus ir bandyk dar kartą.';
    active = false;
    document.body.classList.remove('active');
    connection.textContent = 'PARENGTAS';
  }
}

async function processRecording() {
  if (processing) return;
  processing = true;

  try {
    const type = recorder?.mimeType || 'audio/webm';
    const audio = new Blob(recordedChunks, { type });
    recordedChunks = [];

    if (!audio.size) throw new Error('Garso įrašas tuščias.');

    setState('Atpažįstu kalbą...');

    const sttResponse = await fetch('/api/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': type },
      body: audio
    });

    const stt = await sttResponse.json();
    if (!sttResponse.ok) {
      throw new Error(stt.error || 'Kalbos atpažinimas nepavyko.');
    }

    const userText = String(stt.text || '').trim();
    if (!userText) throw new Error('Neatpažinau tavo žodžių.');

    transcript.textContent = userText;
    setState('Galvoju...');

    const chatResponse = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'user', text: userText }]
      })
    });

    const chat = await chatResponse.json();
    if (!chatResponse.ok) {
      throw new Error(chat.error || 'AI atsakymas nepavyko.');
    }

    const answer = String(chat.answer || '').trim();
    if (!answer) throw new Error('AI grąžino tuščią atsakymą.');

    transcript.textContent = answer;
    setState('Kalbu...');

    const ttsResponse = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: answer })
    });

    if (!ttsResponse.ok) {
      const error = await ttsResponse.json().catch(() => ({}));
      throw new Error(error.error || 'Balso sintezė nepavyko.');
    }

    const wav = await ttsResponse.blob();
    await playReply(wav);

    if (active) setState('Atsakiau. Paspausk mikrofoną, kad kalbėtum vėl.');
  } catch (error) {
    console.error('Voice pipeline error:', error);
    if (active) {
      setState('Nepavyko apdoroti');
      transcript.textContent = error.message ||
        'Įvyko klaida. Pabandyk dar kartą.';
    }
  } finally {
    processing = false;
  }
}

async function playReply(wav) {
  if (!audioContext) throw new Error('Garso sistema neparuošta.');

  await audioContext.resume();

  if (!playbackElement) {
    playbackElement = new Audio();
    playbackSource = audioContext.createMediaElementSource(playbackElement);
    playbackAnalyser = audioContext.createAnalyser();
    playbackAnalyser.fftSize = 512;
    playbackAnalyser.smoothingTimeConstant = 0.78;

    playbackSource.connect(playbackAnalyser);
    playbackAnalyser.connect(audioContext.destination);
  }

  const url = URL.createObjectURL(wav);

  try {
    analyser = playbackAnalyser;
    document.body.classList.add('speaking');
    playbackElement.src = url;
    await playbackElement.play();

    await new Promise((resolve, reject) => {
      playbackElement.onended = resolve;
      playbackElement.onerror = () =>
        reject(new Error('Nepavyko paleisti atsakymo garso.'));
    });
  } finally {
    document.body.classList.remove('speaking');
    analyser = micAnalyser;
    playbackElement.onended = null;
    playbackElement.onerror = null;
    playbackElement.removeAttribute('src');
    playbackElement.load();
    URL.revokeObjectURL(url);
  }
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') {
    setState('Apdoroju tavo klausimą...');
    recorder.stop();
  }
}

function leaveConversation() {
  active = false;
  document.body.classList.remove('active', 'speaking');
  connection.textContent = 'PARENGTAS';
  setState('Paspausk mikrofoną, kad pradėtum');
  transcript.textContent = '';

  if (recorder && recorder.state !== 'inactive') {
    recorder.onstop = null;
    recorder.stop();
  }

  recording = false;
  recordedChunks = [];

  if (playbackElement) {
    playbackElement.pause();
    playbackElement.removeAttribute('src');
    playbackElement.load();
  }

  if (audioContext) {
    audioContext.close().catch(() => {});
    audioContext = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  analyser = null;
  micAnalyser = null;
  playbackAnalyser = null;
  playbackSource = null;
  playbackElement = null;
  cancelAnimationFrame(animationFrame);
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
}

$('mic').addEventListener('click', () => {
  if (recording) {
    stopRecording();
  } else if (!processing) {
    beginRecording();
  }
});

$('close').addEventListener('click', leaveConversation);

connection.textContent = 'PARENGTAS';
setState('Paspausk mikrofoną, kad pradėtum');
resizeCanvas();

  </script>
</body>
</html>
